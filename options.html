<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kokoro Web Reader Settings</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #f3f4f6;
      --text: #1f2937;
      --text-light: #6b7280;
      --border: #d1d5db;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 24px;
      color: var(--text);
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="url"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="url"]:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .hint {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 6px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .status {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #10b981; /* Green */
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .status.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kokoro Reader</h2>
    
    <div class="form-group">
      <label for="apiUrl">API URL</label>
      <input type="url" id="apiUrl">
      <div class="hint">
        <strong>Example Localhost:</strong> http://localhost:8880 <br>
        <strong>Example Domain:</strong> https://tts.yourdomain.com
      </div>
    </div>

    <div class="form-group">
      <label for="voiceId">Voice</label>
      <select id="voiceId">
        <option value="af_bella">Loading voices...</option>
      </select>
      <div class="hint" id="voiceHint">Uses default list. Enter a valid API URL to fetch available voices dynamically.</div>
    </div>

    <button id="save">Save Settings</button>
    <div id="status" class="status">Settings saved successfully!</div>
  </div>

  <script src="options.js"></script>
</body>
</html>
